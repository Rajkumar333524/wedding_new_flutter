name: wedding_new_flutter
description: "Wedding Register Flutter Application"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  cupertino_icons: ^1.0.8

  # Network
  http: ^1.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # State Management
  provider: ^6.1.1

  # Date / Time
  intl: ^0.18.1

  # PDF / Printing / Excel
  printing: ^5.11.0
  pdf: ^3.10.6
  excel: ^2.1.0
  open_file: ^3.3.2

  # File Picker
  file_picker: ^11.0.2

  # Google
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/devta_bg.jpg
    - assets/fonts/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
